services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - chromadb
    networks:
      - hackathon-net

  chromadb:
    image: chromadb/chroma:latest
    expose:
      - "8000"
    networks:
      - hackathon-net

networks:
  hackathon-net:
    driver: bridge
