services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      USE_LOCAL_CHROMA: "false"
    ports:
      - "8080:8080"
    depends_on:
      chromadb:
        condition: service_healthy
    restart: on-failure
    networks:
      - hackathon-net

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hackathon-net

networks:
  hackathon-net:
    driver: bridge

volumes:
  chroma_data:
